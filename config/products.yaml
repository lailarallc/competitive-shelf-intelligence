# Tracked competitor products
#
# This file ships empty. Real competitor products belong in an engagement's private copy, never in this public
# repo: competitors are always anonymized in Lailara output (naming rule, cinderhaven-data-realism
# 01-purpose-and-target-design.md:38). The demo's competitors are fictional ("Competitor A" to "Competitor F")
# and are seeded by scripts/load_synthetic_competitors.py, not scraped. scripts/check_brand_names.py fails CI
# and blocks the deploy if a real competitor brand appears in any tracked file.
#
# HOW TO ADD A PRODUCT (in an engagement's private copy):
#   1. Find the product on Walmart.com or Amazon.com
#   2. Copy the full product URL
#   3. Get the retailer_id: Walmart item ID is in the URL (/ip/.../XXXXXXXX)
#      Amazon ASIN is the 10-character ID in the URL (/dp/XXXXXXXXXX)
#   4. Add an entry in this format:
#
#   - name: "<product title> 9.8 oz"
#     brand: "<brand>"
#     retailer: walmart            # or amazon
#     url: "https://www.walmart.com/ip/<slug>/<item id>"
#     retailer_id: "<item id>"
#     upc: ""                      # optional; links the same product across retailers

products: []
